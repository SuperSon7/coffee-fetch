<script>(()=>{
const root=document.getElementById('coffee-fetch-flow'), content=root.querySelector('#cf-content');
const sources=[
{kind:'release',priority:false,id:'k',tag:'Kubernetes',type:'릴리스',title:'업그레이드 전에 확인할 Kubernetes 변경 사항',summary:'사용 중인 API와 기본 설정 변경을 먼저 확인합니다. 운영 클러스터에 영향을 주는 항목을 골라볼 수 있는 소식입니다.',source:'Kubernetes Blog',url:'https://example.com/kubernetes-release',date:'11.18'},
{kind:'story',priority:false,id:'g',tag:'Grafana',type:'운영 사례',title:'알림은 줄이고, 필요한 신호는 남기는 방법',summary:'비슷한 알림을 묶고 실제 조치가 필요한 조건을 분리하는 운영 사례입니다.',source:'Grafana Blog',url:'https://example.com/grafana-alerts',date:'11.18'},
{kind:'story',priority:false,id:'p',tag:'Python',type:'행사 발표',title:'Python 서비스의 지연 원인을 추적하는 과정',summary:'메트릭에서 이상을 찾고 트레이스로 병목을 좁히는 발표 예시입니다.',source:'기술 행사',url:'https://example.com/python-talk',date:'11.17'},
{kind:'story',priority:false,id:'a',tag:'AI',type:'개발 사례',title:'로컬 모델로 짧은 기술 요약을 만드는 실험',summary:'정해진 자료에서 핵심 변경 사항과 출처를 추출하는 실험 예시입니다.',source:'엔지니어링 블로그',url:'https://example.com/local-summary',date:'11.17'},
{kind:'story',priority:false,id:'c',tag:'Cloud',type:'운영 사례',title:'사용하지 않는 클라우드 자원을 찾는 점검 흐름',summary:'사용량 지표와 소유자 정보를 함께 확인하는 사례 예시입니다.',source:'Cloud Blog',url:'https://example.com/cloud-resources',date:'11.17'},
{id:'linux',kind:'security',priority:true,tag:'Linux',type:'보안',title:'Linux 배포판 보안 패치 안내',summary:'설치된 배포판과 패키지 버전을 공지의 영향 범위와 비교해보세요. 사용 버전이 등록되지 않아 영향 여부는 확인이 필요합니다.',source:'배포판 공식 보안 공지 · 예시',url:'https://example.com/linux-security',date:'11.18'},
{id:'aws',kind:'feature',priority:false,tag:'AWS',type:'새 기능',title:'AWS 서비스의 새 관측 기능',summary:'관심 서비스의 새 기능과 지원 리전을 확인할 수 있는 업데이트 예시입니다.',source:'AWS 공식 업데이트 · 예시',url:'https://example.com/aws-feature',date:'11.18'},
{id:'otel',kind:'release',priority:false,tag:'OpenTelemetry',type:'릴리스',title:'OpenTelemetry Collector 설정 변경 안내',summary:'릴리스의 변경 사항과 설정 호환성을 확인하는 예시입니다. 현재 설치 버전에 대한 영향은 확정하지 않습니다.',source:'공식 릴리스 · 예시',url:'https://example.com/otel-release',date:'11.18'},
{id:'prom',kind:'eol',priority:true,tag:'Prometheus',type:'지원 종료',title:'Prometheus 릴리스 지원 정책 안내',summary:'추적 중인 버전의 지원 기간을 공식 공지에서 확인하는 가상 예시입니다. 실제 지원 종료 공지가 아닙니다.',source:'공식 지원 공지 · 예시',url:'https://example.com/prom-support',date:'11.18'}];
const initialRounds=[{id:'r1',date:'11.17',label:'1회차 · 07:00',ids:['c']},{id:'r2',date:'11.18',label:'1회차 · 07:00',ids:['k','a']},{id:'r3',date:'11.18',label:'2회차 · 10:30',limit:5,ids:['linux','prom','k','g','p','aws','otel']}];
const makeCards=rounds=>rounds.flatMap(r=>r.ids.map(sid=>({...sources.find(s=>s.id===sid),sid,id:r.id+'-'+sid,round:r.id})));
let state={version:3,filter:'all',page:'brief',round:'r3',news:'k',rounds:initialRounds,cards:makeCards(initialRounds),reads:{'r2-k':'읽음'},bookmarks:['r3-g'],topics:['Linux','AWS','Kubernetes','OpenTelemetry','Prometheus','Grafana','Python'],period:'매일',time:'07:00',amount:'5',pending:false};
let expanded=false; let preview=null; const ui={density:'comfortable'};
function restore(s){if(s?.version===3&&Array.isArray(s.rounds)&&Array.isArray(s.cards)&&Array.isArray(s.bookmarks))state={...state,...s};}
restore(window.openai?.widgetState?.privateContent);
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isUpdate=c=>['security','release','feature','eol'].includes(c.kind);
const matches=c=>state.filter==='all'||state.filter==='updates'&&isUpdate(c)||state.filter==='security'&&c.kind==='security'||state.filter==='stories'&&c.kind==='story';
const status=id=>state.reads[id]||'안 읽음';
const round=id=>state.rounds.find(r=>r.id===id);
const latest=date=>state.rounds.filter(r=>r.date===date).at(-1);
const related=sid=>state.cards.filter(c=>c.sid===sid);
function progress(sid){const all=related(sid),n=all.filter(c=>status(c.id)==='읽음').length;return `카드 ${all.length}개 중 ${n}개 읽음${all.length&&n===all.length?' · 다 읽음':''}`;}
function persist(){window.openai?.setWidgetState?.({modelContent:{screen:state.page,readingRule:'카드별 읽음, 소식별 읽은 카드 수 집계',round:state.round},privateContent:state})?.catch(()=>{});}
function toast(t){root.querySelector('#cf-toast').textContent=t;}
function card(x){const read=status(x.id),r=round(x.round);return `<article data-kind="${x.kind}" data-card="${x.id}"><div class="cf-meta"><span class="cf-tag">${x.tag}</span><span>${x.type}</span>${x.priority?'<span class="cf-priority">우선 확인</span>':''}<span class="cf-status">${read==='읽음'?'✓ ':read==='읽는 중'?'◔ ':''}${read}</span></div><h2>${x.title}</h2><p>${x.summary}</p><div class="cf-round-note">${x.source} · ${x.date} · ${escape(r.label)}</div><div class="cf-card-foot"><div class="cf-actions"><button class="cf-primary" data-action="open" data-id="${x.id}">원문 열기 ↗</button><button data-action="read" data-id="${x.id}" ${read==='안 읽음'?'disabled':''}>${read==='읽음'?'읽음 취소':'읽음 표시'}</button><button data-action="bookmark" data-id="${x.id}" aria-pressed="${state.bookmarks.includes(x.id)}">${state.bookmarks.includes(x.id)?'✓ 북마크됨':'＋ 북마크'}</button></div><button class="cf-related" data-action="news" data-id="${x.sid}" aria-label="소식·관련 카드 보기">${progress(x.sid)} →</button></div></article>`;}
function render(){root.dataset.density=ui.density;root.querySelector('#cf-side-topics').innerHTML=state.topics.map(t=>`<li>${escape(t)}</li>`).join('');root.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===state.page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
if(state.page==='settings'){
content.innerHTML=`<div class="cf-topline"><div><h1>관심사·설정</h1><p class="cf-muted">관심 기술의 업데이트와 읽을거리를 한곳에서.</p></div></div><form id="cf-settings" autocomplete="off"><fieldset><legend>관심 분야·도구</legend><div class="cf-options">${['IT','DevOps','Cloud','AI','Observability','Linux','AWS','Kubernetes','OpenTelemetry','Prometheus','Grafana','Python'].map(t=>`<label><input type="checkbox" name="topic" value="${t}" ${state.topics.includes(t)?'checked':''}>${t}</label>`).join('')}</div></fieldset><fieldset><legend>브리핑 받기</legend><div class="cf-fields"><label>주기<select name="period">${['매일','평일','매주'].map(p=>`<option ${state.period===p?'selected':''}>${p}</option>`).join('')}</select></label><label>시각<input type="time" name="time" value="${escape(state.time)}" required></label><label>기본으로 펼칠 분량<select name="amount">${['3','5','10'].map(n=>`<option value="${n}" ${state.amount===n?'selected':''}>우선 ${n}개</option>`).join('')}</select></label></div></fieldset><fieldset><legend>변경한 관심사 적용</legend><label><input type="radio" name="apply" value="next" checked> 다음 브리핑부터</label><p class="cf-muted">현재 회차는 그대로 유지합니다.</p><label style="display:block;margin-top:12px"><input type="radio" name="apply" value="now"> 지금 적용</label><p class="cf-muted">새 회차를 만들고 표시합니다. 이전 회차·읽기 기록·북마크는 남습니다.</p></fieldset><button class="cf-primary" type="submit">설정 저장</button></form>`;return;}
let title='',sub='',controls='',body='';
if(state.page==='news'){
const src=sources.find(s=>s.id===state.news);title='소식과 관련 카드';sub=progress(src.id);
body=`<div class="cf-note"><h2>${src.title}</h2><p>${src.source} · 원문 주소 기준으로 묶은 소식</p><p style="overflow-wrap:anywhere">${src.url} (가상 주소)</p></div><div class="cf-feed">${related(src.id).slice().reverse().map(card).join('')}</div>`;
}else if(state.page==='saved'){
title='북마크';sub='표시해둔 카드를 소식별로 모았습니다.';
const ids=[...new Set(state.bookmarks.map(id=>state.cards.find(c=>c.id===id)?.sid).filter(Boolean))];
body=ids.length?ids.map(sid=>{const src=sources.find(s=>s.id===sid);return `<section style="margin-bottom:24px"><div class="cf-note"><h2>${src.title}</h2><p>${src.source} · ${progress(sid)}</p><p style="overflow-wrap:anywhere" class="cf-muted">${src.url} (가상 주소)</p></div><div class="cf-feed">${related(sid).filter(c=>state.bookmarks.includes(c.id)).map(card).join('')}</div></section>`;}).join(''):'<div class="cf-empty"><h2>북마크한 카드가 없습니다</h2><p>브리핑에서 다시 보고 싶은 카드를 북마크해보세요.</p></div>';
}else{
const r=round(state.round)||state.rounds.at(-1);state.round=r.id;title=r.date==='11.18'?'오늘의 브리핑':'지난 브리핑';sub=`${r.date} · ${r.label} · 업데이트와 읽을거리 ${r.ids.length}개`;
controls=`<div class="cf-fields"><label class="cf-muted">날짜<select id="cf-date">${[...new Set(state.rounds.map(x=>x.date))].reverse().map(d=>`<option value="${d}" ${r.date===d?'selected':''}>${d}${d==='11.18'?' 오늘':''}</option>`).join('')}</select></label><label class="cf-muted">회차<select id="cf-round">${state.rounds.filter(x=>x.date===r.date).slice().reverse().map(x=>`<option value="${x.id}" ${r.id===x.id?'selected':''}>${escape(x.label)}${latest(r.date).id===x.id?' · 최신':''}</option>`).join('')}</select></label></div>`;
const all=state.cards.filter(c=>c.round===r.id);
const limit=r.limit||all.length, base=all.slice(0,limit), hiddenUpdates=all.slice(limit).filter(isUpdate).length;
const visible=(state.filter==='all'&&!expanded?base:all).filter(matches);
body=(state.pending?'<div class="cf-note">관심사 변경을 저장했습니다. 다음 브리핑부터 적용됩니다.</div>':'')+
`<div class="cf-filters" role="group" aria-label="소식 유형">${[['all','전체'],['updates','업데이트'],['security','보안'],['stories','사례·발표']].map(([v,label])=>`<button data-action="filter" data-id="${v}" aria-pressed="${state.filter===v}">${label}</button>`).join('')}</div>
<p class="cf-muted" style="margin:12px 0" role="status">${state.filter==='all'&&!expanded?`우선 ${visible.length}개 / 이번 회차 ${all.length}개`:`${visible.length}개 표시`} · 중요한 변화부터, 내 속도로.</p>
<div class="cf-feed">${visible.map(card).join('')||'<div class="cf-empty"><h2>이 유형의 소식이 없습니다</h2><p>다른 유형을 선택하거나 전체 소식을 확인하세요.</p><button data-action="filter" data-id="all">전체 소식 보기</button></div>'}</div>
${state.filter==='all'&&!expanded&&all.length>limit?`<div class="cf-actions">${hiddenUpdates?`<button data-action="filter" data-id="updates">업데이트 더 보기 · ${hiddenUpdates}개 접힘</button>`:''}<button data-action="expand">이번 회차 전체 보기 · ${all.length}개</button></div>`:''}`;
}
content.innerHTML=`<div class="cf-topline"><div><h1>${title}</h1><p class="cf-muted">${escape(sub)}</p></div>${controls}</div>${preview?`<div class="cf-preview"><h2>원문을 열었습니다 · 동작 예시</h2><p>이 카드만 읽는 중으로 표시합니다. 다른 회차의 카드는 바뀌지 않습니다.</p><div class="cf-actions"><button class="cf-primary" data-action="finish" data-id="${preview}">다 읽었어요 · 읽음 표시</button><button data-action="back">아직 읽는 중 · 돌아가기</button></div></div>`:''}${body}`;
}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){state.page=b.dataset.page;if(state.page==='brief')state.round=state.rounds.at(-1).id;preview=null;toast('');render();persist();return;}const id=b.dataset.id;switch(b.dataset.action){case'filter':state.filter=id;preview=null;render();persist();root.querySelector(`.cf-filters [data-id="${id}"]`)?.focus();return;case'expand':expanded=true;render();persist();return;case'open':if(status(id)!=='읽음')state.reads[id]='읽는 중';preview=id;toast('가상 예시이므로 외부 페이지는 열지 않습니다.');break;case'read':state.reads[id]=status(id)==='읽음'?'읽는 중':'읽음';toast('이 카드의 읽기 상태를 변경했습니다.');break;case'finish':state.reads[id]='읽음';preview=null;toast('이 카드를 읽음으로 표시했습니다.');break;case'back':preview=null;break;case'bookmark':state.bookmarks=state.bookmarks.includes(id)?state.bookmarks.filter(v=>v!==id):[...state.bookmarks,id];toast(state.bookmarks.includes(id)?'카드를 북마크했습니다.':'북마크를 해제했습니다. 카드와 읽기 기록은 유지됩니다.');break;case'news':state.page='news';state.news=id;preview=null;toast('');break;default:return;}render();persist();});
root.addEventListener('change',e=>{if(e.target.id==='cf-date'){state.round=latest(e.target.value).id;}else if(e.target.id==='cf-round'){state.round=e.target.value;}else return;expanded=false;preview=null;toast('');render();persist();});
root.addEventListener('submit',e=>{if(e.target.id!=='cf-settings')return;e.preventDefault();const f=new FormData(e.target),topics=f.getAll('topic');if(!topics.length){toast('관심 분야나 도구를 하나 이상 선택해주세요.');return;}state.topics=topics;state.period=f.get('period');state.time=f.get('time');state.amount=f.get('amount');state.pending=f.get('apply')==='next';if(!state.pending){const ids=sources.filter(x=>topics.includes(x.tag)||topics.includes('IT')||topics.includes('DevOps')||topics.includes('Observability')&&['g','p','otel','prom'].includes(x.id)).sort((a,b)=>Number(b.priority)-Number(a.priority)).map(x=>x.id);const n=state.rounds.filter(r=>r.date==='11.18').length+1;const r={id:'r'+(state.rounds.length+1),date:'11.18',label:n+'회차 · 즉시 생성',limit:Number(state.amount),ids};state.rounds.push(r);state.cards.push(...makeCards([r]));state.round=r.id;state.page='brief';state.filter='all';expanded=false;}render();toast(state.pending?'다음 브리핑부터 적용됩니다.':'새 회차를 만들었습니다. 이전 회차는 그대로 보관됩니다.');persist();});
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState?.privateContent){restore(e.detail.globals.widgetState.privateContent);preview=null;render();}});
render();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(ui,'density',{label:'카드 간격',options:[{label:'여유 있게',value:'comfortable'},{label:'촘촘하게',value:'compact'}]});}
})();</script>
</div>
</body></html>
