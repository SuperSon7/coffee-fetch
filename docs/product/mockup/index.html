<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coffee Fetch 목업</title><style>:root{color-scheme:light}body{margin:0;padding:24px;background:#eeefeb}#coffee-fetch-flow{max-width:1024px;margin:auto}button{cursor:pointer}@media(max-width:540px){body{padding:8px}}</style></head><body><div id="coffee-fetch-flow" aria-label="Coffee Fetch 화면 목업">
<style>
#coffee-fetch-flow{--cf-bg:light-dark(#f6f5f1,#191b1a);--cf-paper:light-dark(#fff,#232624);--cf-ink:light-dark(#232c27,#e6ece7);--cf-dim:light-dark(#657068,#a5b2a9);--cf-line:light-dark(#dfe4de,#3d453f);--cf-green:light-dark(#245d44,#a7d8b8);--cf-on:light-dark(#fff,#193724);--cf-soft:light-dark(#e8efe7,#2c3b30);font:14px/1.6 system-ui,sans-serif;color:var(--cf-ink);background:var(--cf-bg);border:1px solid var(--cf-line);border-radius:16px;overflow:hidden}
#coffee-fetch-flow *{box-sizing:border-box}#coffee-fetch-flow button,#coffee-fetch-flow select,#coffee-fetch-flow input{font:inherit;color:inherit}#coffee-fetch-flow button{background:var(--cf-paper);border:1px solid var(--cf-line);border-radius:8px;padding:8px 12px;min-height:40px}#coffee-fetch-flow button:hover{border-color:var(--cf-green)}#coffee-fetch-flow button:disabled{opacity:.5}#coffee-fetch-flow button.cf-primary{background:var(--cf-green);color:var(--cf-on);border-color:var(--cf-green)}#coffee-fetch-flow h1{font-size:27px;letter-spacing:-1px;line-height:1.3;margin:5px 0 9px;font-weight:600}#coffee-fetch-flow h2{font-size:18px;line-height:1.5;margin:8px 0;font-weight:600}#coffee-fetch-flow p{margin:0}#coffee-fetch-flow .cf-muted{color:var(--cf-dim);font-size:13px}#coffee-fetch-flow header{padding:18px 26px;border-bottom:1px solid var(--cf-line);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--cf-paper)}#coffee-fetch-flow .cf-brand{font-weight:650;font-size:19px;letter-spacing:-.5px}#coffee-fetch-flow .cf-brand span{color:var(--cf-green)}#coffee-fetch-flow nav{display:flex;flex-wrap:wrap;gap:6px}#coffee-fetch-flow nav button{border-color:transparent;background:transparent}#coffee-fetch-flow nav button[aria-current="page"]{background:var(--cf-soft);color:var(--cf-green)}#coffee-fetch-flow main{max-width:790px;margin:auto;padding:30px 26px 22px;min-height:540px}#coffee-fetch-flow .cf-topline{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}#coffee-fetch-flow select,#coffee-fetch-flow input[type=time]{background:var(--cf-paper);border:1px solid var(--cf-line);border-radius:8px;padding:9px;max-width:100%}#coffee-fetch-flow .cf-overline{font-size:11px;letter-spacing:1.8px;font-weight:600;color:var(--cf-green)}#coffee-fetch-flow .cf-feed{display:grid;gap:13px}#coffee-fetch-flow article{padding:20px;background:var(--cf-paper);border:1px solid var(--cf-line);border-radius:12px}#coffee-fetch-flow .cf-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--cf-dim);font-size:12px}#coffee-fetch-flow .cf-tag{background:var(--cf-soft);color:var(--cf-green);border-radius:5px;padding:2px 7px}#coffee-fetch-flow .cf-status{margin-left:auto}#coffee-fetch-flow .cf-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:17px}#coffee-fetch-flow .cf-actions button{font-size:12px;min-height:36px}#coffee-fetch-flow .cf-actions button:last-child{margin-left:auto}#coffee-fetch-flow .cf-note{padding:12px 14px;border-left:3px solid var(--cf-green);background:var(--cf-soft);margin-bottom:18px;font-size:13px}#coffee-fetch-flow fieldset{border:0;padding:0;margin:0 0 26px}#coffee-fetch-flow legend{font-weight:600;margin-bottom:10px}#coffee-fetch-flow .cf-options{display:flex;flex-wrap:wrap;gap:8px}#coffee-fetch-flow .cf-options label{display:flex;gap:7px;align-items:center;border:1px solid var(--cf-line);background:var(--cf-paper);padding:8px 12px;border-radius:8px}#coffee-fetch-flow input{accent-color:var(--cf-green)}#coffee-fetch-flow .cf-fields{display:flex;gap:20px;flex-wrap:wrap}#coffee-fetch-flow .cf-fields label{display:grid;gap:7px}#coffee-fetch-flow .cf-empty{padding:48px 18px;text-align:center;background:var(--cf-paper);border-radius:12px}#coffee-fetch-flow footer{padding:12px 26px;border-top:1px solid var(--cf-line);display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;font-size:11px;color:var(--cf-dim)}#coffee-fetch-flow .cf-toast{color:var(--cf-green);min-height:26px;margin-top:14px;font-size:13px}#coffee-fetch-flow .cf-preview{padding:20px;border:1px dashed var(--cf-green);border-radius:12px;background:var(--cf-paper);margin-bottom:18px}#coffee-fetch-flow .cf-preview h2{margin-top:0}#coffee-fetch-flow[data-density="compact"] article{padding:13px 18px}#coffee-fetch-flow[data-density="compact"] .cf-actions{margin-top:9px}
@media(max-width:540px){#coffee-fetch-flow header{padding:16px}#coffee-fetch-flow main{padding:22px 16px}#coffee-fetch-flow nav{width:100%}#coffee-fetch-flow nav button{padding:8px;font-size:13px}#coffee-fetch-flow article{padding:16px}#coffee-fetch-flow h1{font-size:23px}#coffee-fetch-flow .cf-status{margin-left:0}#coffee-fetch-flow .cf-actions button{min-height:44px}#coffee-fetch-flow .cf-actions button:last-child{margin-left:0}}
</style>
<header><div class="cf-brand">☕ Coffee <span>Fetch</span></div><nav aria-label="주 메뉴"><button data-page="brief" aria-current="page">브리핑</button><button data-page="saved">북마크</button><button data-page="settings">관심사·설정</button></nav></header>
<main><div id="cf-content"></div><div class="cf-toast" id="cf-toast" role="status" aria-live="polite"></div></main>
<footer><span>화면·동작 검토용 목업 · 모든 소식은 가상 예시</span><span>Coffee Fetch / 01</span></footer>
<script>(()=>{
const root=document.getElementById('coffee-fetch-flow'), content=root.querySelector('#cf-content');
const sources=[
{id:'k',tag:'Kubernetes',type:'릴리스',title:'업그레이드 전에 확인할 Kubernetes 변경 사항',summary:'사용 중인 API와 기본 설정 변경을 먼저 확인합니다. 운영 클러스터에 영향을 주는 항목을 골라볼 수 있는 소식입니다.',source:'Kubernetes Blog',url:'https://example.com/kubernetes-release',date:'09.26'},
{id:'g',tag:'Grafana',type:'운영 사례',title:'알림은 줄이고, 필요한 신호는 남기는 방법',summary:'비슷한 알림을 묶고 실제 조치가 필요한 조건을 분리하는 운영 사례입니다.',source:'Grafana Blog',url:'https://example.com/grafana-alerts',date:'09.26'},
{id:'p',tag:'Python',type:'행사 발표',title:'Python 서비스의 지연 원인을 추적하는 과정',summary:'메트릭에서 이상을 찾고 트레이스로 병목을 좁히는 발표 예시입니다.',source:'기술 행사',url:'https://example.com/python-talk',date:'09.25'},
{id:'a',tag:'AI',type:'개발 사례',title:'로컬 모델로 짧은 기술 요약을 만드는 실험',summary:'정해진 자료에서 핵심 변경 사항과 출처를 추출하는 실험 예시입니다.',source:'엔지니어링 블로그',url:'https://example.com/local-summary',date:'09.25'},
{id:'c',tag:'Cloud',type:'운영 사례',title:'사용하지 않는 클라우드 자원을 찾는 점검 흐름',summary:'사용량 지표와 소유자 정보를 함께 확인하는 사례 예시입니다.',source:'Cloud Blog',url:'https://example.com/cloud-resources',date:'09.25'}];
const initialRounds=[{id:'r1',date:'09.25',label:'1회차 · 07:00',ids:['c']},{id:'r2',date:'09.26',label:'1회차 · 07:00',ids:['k','a']},{id:'r3',date:'09.26',label:'2회차 · 10:30',ids:['k','g','p']}];
const makeCards=rounds=>rounds.flatMap(r=>r.ids.map(sid=>({...sources.find(s=>s.id===sid),sid,id:r.id+'-'+sid,round:r.id})));
let state={version:2,page:'brief',round:'r3',news:'k',rounds:initialRounds,cards:makeCards(initialRounds),reads:{'r2-k':'읽음'},bookmarks:['r3-g'],topics:['Kubernetes','Grafana','Python'],period:'매일',time:'07:00',amount:'3',pending:false};
let preview=null; const ui={density:'comfortable'};
function restore(s){if(s?.version===2&&Array.isArray(s.rounds)&&Array.isArray(s.cards)&&Array.isArray(s.bookmarks))state={...state,...s};}
restore(window.openai?.widgetState?.privateContent);
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const status=id=>state.reads[id]||'안 읽음';
const round=id=>state.rounds.find(r=>r.id===id);
const latest=date=>state.rounds.filter(r=>r.date===date).at(-1);
const related=sid=>state.cards.filter(c=>c.sid===sid);
function progress(sid){const all=related(sid),n=all.filter(c=>status(c.id)==='읽음').length;return `카드 ${all.length}개 중 ${n}개 읽음${all.length&&n===all.length?' · 다 읽음':''}`;}
function persist(){window.openai?.setWidgetState?.({modelContent:{screen:state.page,readingRule:'카드별 읽음, 소식별 읽은 카드 수 집계',round:state.round},privateContent:state})?.catch(()=>{});}
function toast(t){root.querySelector('#cf-toast').textContent=t;}
function card(x){const read=status(x.id),r=round(x.round);return `<article data-card="${x.id}"><div class="cf-meta"><span class="cf-tag">${x.tag}</span><span>${x.type} · ${x.source} · 게시 ${x.date}</span><span class="cf-status">${read==='읽음'?'✓ ':read==='읽는 중'?'◔ ':''}${read}</span></div><h2>${x.title}</h2><p>${x.summary}</p><p class="cf-muted" style="margin-top:10px">${r.date} ${escape(r.label)}의 카드</p><div class="cf-actions"><button class="cf-primary" data-action="open" data-id="${x.id}">원문 열기 ↗</button><button data-action="read" data-id="${x.id}" ${read==='안 읽음'?'disabled':''}>${read==='읽음'?'읽음 취소':'읽음 표시'}</button><button data-action="bookmark" data-id="${x.id}" aria-pressed="${state.bookmarks.includes(x.id)}">${state.bookmarks.includes(x.id)?'✓ 북마크됨':'＋ 북마크'}</button></div><div style="border-top:1px solid var(--cf-line);margin-top:15px;padding-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="cf-muted">이 소식 · ${progress(x.sid)}</span><button data-action="news" data-id="${x.sid}" style="margin-left:auto;font-size:12px">소식·관련 카드 보기</button></div></article>`;}
function render(){root.dataset.density=ui.density;root.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===state.page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
if(state.page==='settings'){
content.innerHTML=`<div class="cf-topline"><div><div class="cf-overline">YOUR DAILY BREW</div><h1>관심사·설정</h1><p class="cf-muted">관심 있는 기술을, 읽을 수 있는 만큼.</p></div></div><form id="cf-settings"><fieldset><legend>관심 분야·도구</legend><div class="cf-options">${['IT','DevOps','Cloud','AI','Observability','Kubernetes','Grafana','Python'].map(t=>`<label><input type="checkbox" name="topic" value="${t}" ${state.topics.includes(t)?'checked':''}>${t}</label>`).join('')}</div></fieldset><fieldset><legend>브리핑 받기</legend><div class="cf-fields"><label>주기<select name="period">${['매일','평일','매주'].map(p=>`<option ${state.period===p?'selected':''}>${p}</option>`).join('')}</select></label><label>시각<input type="time" name="time" value="${escape(state.time)}" required></label><label>한 번에 읽을 분량<select name="amount">${['3','5','10'].map(n=>`<option value="${n}" ${state.amount===n?'selected':''}>최대 ${n}개</option>`).join('')}</select></label></div></fieldset><fieldset><legend>변경한 관심사 적용</legend><label><input type="radio" name="apply" value="next" checked> 다음 브리핑부터</label><p class="cf-muted">현재 회차는 그대로 유지합니다.</p><label style="display:block;margin-top:12px"><input type="radio" name="apply" value="now"> 지금 적용</label><p class="cf-muted">새 회차를 만들고 표시합니다. 이전 회차·읽기 기록·북마크는 남습니다.</p></fieldset><button class="cf-primary" type="submit">설정 저장</button></form>`;return;}
let title='',sub='',controls='',body='';
if(state.page==='news'){
const src=sources.find(s=>s.id===state.news);title='소식과 관련 카드';sub=progress(src.id);
body=`<div class="cf-note"><h2>${src.title}</h2><p>${src.source} · 원문 주소 기준으로 묶은 소식</p><p style="overflow-wrap:anywhere">${src.url} (가상 주소)</p></div><div class="cf-feed">${related(src.id).slice().reverse().map(card).join('')}</div>`;
}else if(state.page==='saved'){
title='북마크';sub='표시해둔 카드를 소식별로 모았습니다.';
const ids=[...new Set(state.bookmarks.map(id=>state.cards.find(c=>c.id===id)?.sid).filter(Boolean))];
body=ids.length?ids.map(sid=>{const src=sources.find(s=>s.id===sid);return `<section style="margin-bottom:24px"><div class="cf-note"><h2>${src.title}</h2><p>${src.source} · ${progress(sid)}</p><p style="overflow-wrap:anywhere" class="cf-muted">${src.url} (가상 주소)</p></div><div class="cf-feed">${related(sid).filter(c=>state.bookmarks.includes(c.id)).map(card).join('')}</div></section>`;}).join(''):'<div class="cf-empty"><h2>북마크한 카드가 없습니다</h2><p>브리핑에서 다시 보고 싶은 카드를 북마크해보세요.</p></div>';
}else{
const r=round(state.round)||state.rounds.at(-1);state.round=r.id;title=r.date==='09.26'?'오늘의 브리핑':'지난 브리핑';sub=`${r.date} · ${r.label} · ${r.ids.length}개의 카드`;
controls=`<div class="cf-fields"><label class="cf-muted">날짜<select id="cf-date">${[...new Set(state.rounds.map(x=>x.date))].reverse().map(d=>`<option value="${d}" ${r.date===d?'selected':''}>${d}${d==='09.26'?' 오늘':''}</option>`).join('')}</select></label><label class="cf-muted">회차<select id="cf-round">${state.rounds.filter(x=>x.date===r.date).slice().reverse().map(x=>`<option value="${x.id}" ${r.id===x.id?'selected':''}>${escape(x.label)}${latest(r.date).id===x.id?' · 최신':''}</option>`).join('')}</select></label></div>`;
body=(state.pending?'<div class="cf-note">관심사 변경을 저장했습니다. 다음 브리핑부터 적용됩니다.</div>':'')+`<div class="cf-feed">${state.cards.filter(c=>c.round===r.id).map(card).join('')||'<div class="cf-empty">관심사에 맞는 새 소식이 없습니다.</div>'}</div>`;
}
content.innerHTML=`<div class="cf-topline"><div><div class="cf-overline">COFFEE FETCH</div><h1>${title}</h1><p class="cf-muted">${escape(sub)}</p></div>${controls}</div>${preview?`<div class="cf-preview"><h2>원문을 열었습니다 · 동작 예시</h2><p>이 카드만 읽는 중으로 표시합니다. 다른 회차의 카드는 바뀌지 않습니다.</p><div class="cf-actions"><button class="cf-primary" data-action="finish" data-id="${preview}">다 읽었어요 · 읽음 표시</button><button data-action="back">아직 읽는 중 · 돌아가기</button></div></div>`:''}${body}`;
}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){state.page=b.dataset.page;if(state.page==='brief')state.round=state.rounds.at(-1).id;preview=null;toast('');render();persist();return;}const id=b.dataset.id;switch(b.dataset.action){case'open':if(status(id)!=='읽음')state.reads[id]='읽는 중';preview=id;toast('가상 예시이므로 외부 페이지는 열지 않습니다.');break;case'read':state.reads[id]=status(id)==='읽음'?'읽는 중':'읽음';toast('이 카드의 읽기 상태를 변경했습니다.');break;case'finish':state.reads[id]='읽음';preview=null;toast('이 카드를 읽음으로 표시했습니다.');break;case'back':preview=null;break;case'bookmark':state.bookmarks=state.bookmarks.includes(id)?state.bookmarks.filter(v=>v!==id):[...state.bookmarks,id];toast(state.bookmarks.includes(id)?'카드를 북마크했습니다.':'북마크를 해제했습니다. 카드와 읽기 기록은 유지됩니다.');break;case'news':state.page='news';state.news=id;preview=null;toast('');break;default:return;}render();persist();});
root.addEventListener('change',e=>{if(e.target.id==='cf-date'){state.round=latest(e.target.value).id;}else if(e.target.id==='cf-round'){state.round=e.target.value;}else return;preview=null;toast('');render();persist();});
root.addEventListener('submit',e=>{if(e.target.id!=='cf-settings')return;e.preventDefault();const f=new FormData(e.target),topics=f.getAll('topic');if(!topics.length){toast('관심 분야나 도구를 하나 이상 선택해주세요.');return;}state.topics=topics;state.period=f.get('period');state.time=f.get('time');state.amount=f.get('amount');state.pending=f.get('apply')==='next';if(!state.pending){const ids=sources.filter(x=>topics.includes(x.tag)||topics.includes('IT')||topics.includes('DevOps')||topics.includes('Observability')&&['g','p'].includes(x.id)).slice(0,Number(state.amount)).map(x=>x.id);const n=state.rounds.filter(r=>r.date==='09.26').length+1;const r={id:'r'+(state.rounds.length+1),date:'09.26',label:n+'회차 · 즉시 생성',ids};state.rounds.push(r);state.cards.push(...makeCards([r]));state.round=r.id;state.page='brief';}render();toast(state.pending?'다음 브리핑부터 적용됩니다.':'새 회차를 만들었습니다. 이전 회차는 그대로 보관됩니다.');persist();});
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState?.privateContent){restore(e.detail.globals.widgetState.privateContent);preview=null;render();}});
render();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(ui,'density',{label:'카드 간격',options:[{label:'여유 있게',value:'comfortable'},{label:'촘촘하게',value:'compact'}]});}
})();</script>
</div>
</body></html>
