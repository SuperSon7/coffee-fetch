[project]
name = "coffee-fetch-server"
version = "0.0.0"
description = "Coffee Fetch API and background jobs; environment prepared before implementation"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "sqlalchemy>=2.1,<3",
  "alembic>=1.13,<2",
  "httpx>=0.28,<1",
  "feedparser>=6,<7",
  "apscheduler>=3.11,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1,<2"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.mypy]
python_version = "3.13"
strict = true